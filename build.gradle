plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Selenium and TestNG dependencies
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.25.0'
    testImplementation 'org.testng:testng:7.10.2'
}

application {
    mainClass = 'org.example.Main'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.example.Main'
        )
    }
}

test {
    useTestNG()
}

tasks.register('cleanDocs', Delete) {
    delete layout.projectDirectory.dir('docs')
}

tasks.register('mergeResourcesToDocs', Copy) {
    dependsOn cleanDocs
    from('src/main/resources') {
        include '*.html', '*.css', '*.js'
    }
    into layout.projectDirectory.dir('docs')
}

tasks.named('build') {
    dependsOn mergeResourcesToDocs
}